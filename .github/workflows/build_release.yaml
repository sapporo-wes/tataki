name: build_release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  guard:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          # The whole tag list is needed to tell whether this tag is the highest
          # version; the default shallow fetch brings only the tag being built.
          fetch-depth: 0

      - name: "Check the tag and decide whether it is the latest release"
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          cargo_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::tag ${tag} does not match Cargo.toml (${cargo_version})"
            exit 1
          fi

          # `sort -V` orders v0.2.0 before v0.2.0-alpha, the reverse of semver,
          # so pre-releases are dropped before the comparison instead of being
          # sorted alongside the stable tags.
          highest=$(git tag -l 'v*.*.*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)

          if printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$tag" = "$highest" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=${tag} highest=${highest}" >> "$GITHUB_STEP_SUMMARY"

  build_binary:
    needs: [guard]
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64
            tag: x86_64-musl
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            name: aarch64
            tag: aarch64-musl
            target: aarch64-unknown-linux-musl
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Cache builder image"
        id: cache-builder-image
        uses: actions/cache@v4
        with:
          path: musl-builder-image-${{ matrix.name }}
          key: musl-builder-image-${{ matrix.name }}

      - name: "Pull and save builder image"
        if: steps.cache-builder-image.outputs.cache-hit != 'true'
        run: |
          docker pull messense/rust-musl-cross:${{ matrix.tag }}
          docker save messense/rust-musl-cross:${{ matrix.tag }} -o musl-builder-image-${{ matrix.name }}

      - name: "Load builder image"
        run: docker load -i musl-builder-image-${{ matrix.name }}

      - name: "Cache Rust"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: "Build binary"
        run: docker run --rm -u root -v "$(pwd)":/home/rust/src messense/rust-musl-cross:${{ matrix.tag }} cargo build --release

      - name: "Upload binary"
        uses: actions/upload-artifact@v4
        with:
          name: tataki-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/tataki

  create_release:
    needs: [guard, build_binary]
    name: Create release for ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: x86_64
          - name: aarch64
    steps:
      - name: "Download tataki binary"
        uses: actions/download-artifact@v4
        with:
          name: tataki-${{ matrix.name }}
      - name: Upload tataki binary
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tataki
          asset_name: tataki-${{ matrix.name }}
          # Both default to marking every tag as the newest release, which would
          # hand the Latest badge to a patch cut for an older line.
          make_latest: ${{ needs.guard.outputs.is_latest }}
          prerelease: ${{ needs.guard.outputs.is_prerelease }}

  deploy_ghcr:
    needs: [guard, create_release]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tataki
          # `latest=auto` would still move the tag for a patch on an older line,
          # because it only asks whether the ref is a stable semver tag.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ needs.guard.outputs.is_latest == 'true' }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TATAKI_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
